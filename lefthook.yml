# Lefthook 配置文件
# 用于管理 Git hooks，自动进行代码格式化和规范检查

pre-commit:
  parallel: false  # 顺序执行，先格式化再检查
  commands:
    # 1. 代码格式化（自动修复缩进、空格等问题）
    format:
      glob: "*.dart"
      run: |
        echo "正在格式化代码..."
        dart format {staged_files}
      stage_fixed: true

    # 2. 代码规范检查（只检查修改的文件）
    analyze:
      glob: "*.dart"
      run: |
        echo "正在检查代码规范（仅检查修改的文件）..."
        echo "检查未使用的变量、导入和死代码..."
        dart analyze --fatal-warnings {staged_files}

    # 3. 检查是否有冲突标记
    conflict-markers:
      glob: "*.{dart,yaml,json,md}"
      run: |
        conflicts=$(echo "{staged_files}" | xargs grep -l "^<<<<<<< " 2>/dev/null || true)
        if [ -n "$conflicts" ]; then
          echo "❌ 检测到冲突标记，请解决冲突后再提交:"
          echo "$conflicts"
          exit 1
        fi

